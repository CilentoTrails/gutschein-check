<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#14532d">
  <title>Gutschein-Check</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Gutschein-Check">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1>Gutschein-Check</h1>
      <p>Karte mit der Rückseite vor die Kamera halten. Marke, Nummer und Code werden automatisch erkannt.</p>
    </header>

    <div class="actions">
      <button id="btn-camera" type="button">Kamera starten</button>
      <label class="button secondary">
        Foto wählen
        <input id="file" type="file" accept="image/*" hidden>
      </label>
    </div>

    <section id="stage" hidden>
      <div class="viewport">
        <video id="video" playsinline muted></video>
        <div class="frame"></div>
      </div>
      <div class="actions">
        <button id="btn-snap" type="button">Jetzt auslesen</button>
        <button id="btn-stop" type="button" class="secondary">Abbrechen</button>
      </div>
    </section>

    <p id="status" role="status" hidden></p>

    <section id="result" hidden></section>

    <footer>
      Alles läuft nur auf deinem Gerät. Fotos und Kartendaten werden nicht hochgeladen.
    </footer>
  </main>

  <script src="vendor/zxing/zxing-reader.js"></script>
  <script src="vendor/tesseract/tesseract.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
